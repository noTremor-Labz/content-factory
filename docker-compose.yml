# OpenClaw: https://docs.openclaw.ai/install/docker
# CLI: docker compose --profile cli run --rm openclaw-cli <команда>

services:

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    platform: linux/arm64
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ./shared:/home/node/shared
      - ${HOST_SHARED_PATH:-./shared}:/home/node/shared
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENCLAW_HOOKS_TOKEN=${OPENCLAW_HOOKS_TOKEN}
      - TELEGRAM_DIRECTOR_BOT_TOKEN=${TELEGRAM_DIRECTOR_BOT_TOKEN}
      - TELEGRAM_APPROVAL_BOT_TOKEN=${TELEGRAM_APPROVAL_BOT_TOKEN}
      - TELEGRAM_CHANNEL_TOMAS_FOOD=${TELEGRAM_CHANNEL_TOMAS_FOOD}
      - TELEGRAM_CHANNEL_TOMAS_VIBE=${TELEGRAM_CHANNEL_TOMAS_VIBE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMMONSTACK_API_KEY=${COMMONSTACK_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      # Pixel (fal.ai / Replicate) + media upload (Cloudflare R2) env vars
      - FAL_KEY=${FAL_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - KLING_API_KEY=${KLING_API_KEY}
      - RUNWAYML_API_SECRET=${RUNWAYML_API_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_RAW=${R2_BUCKET_RAW}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    platform: linux/arm64
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${HOST_SHARED_PATH:-./shared}:/home/node/shared
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMMONSTACK_API_KEY=${COMMONSTACK_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      # Keep same env vars in CLI container (some tools may reuse runtime)
      - FAL_KEY=${FAL_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - KLING_API_KEY=${KLING_API_KEY}
      - RUNWAYML_API_SECRET=${RUNWAYML_API_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_RAW=${R2_BUCKET_RAW}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    profiles:
      - cli

  agent-board:
    image: node:22-slim
    platform: linux/arm64
    container_name: agent-board
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${HOST_AGENT_BOARD_PATH:-./agent-board/dist}:/app
      # index.js отдаёт статику из ../dashboard → в контейнере это /dashboard (не внутри dist)
      - ${HOST_AGENT_BOARD_DASHBOARD:-./agent-board/dashboard}:/dashboard
      - agent-board-data:/app/data
    environment:
      - AGENTBOARD_API_KEYS=${AGENTBOARD_API_KEYS}
      - OPENCLAW_HOOK_URL=http://openclaw-gateway:18789/hooks/agent
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN}
      - AGENTBOARD_WEBHOOK_SECRET=${AGENTBOARD_WEBHOOK_SECRET}
    ports:
      - "3456:3456"
    command: node index.js --port 3456 --data ./data
    depends_on:
      openclaw-gateway:
        condition: service_healthy

  filebrowser:
    image: filebrowser/filebrowser:latest
    platform: linux/arm64
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Корень проекта content-factory (путь к каталогу с docker-compose.yml)
      - ${HOST_FILEBROWSER_ROOT:-.}:/srv
      - filebrowser-data:/database

  telegram-bot:
    build: ./telegram_bot
    platform: linux/arm64
    container_name: telegram-bot
    restart: unless-stopped
    env_file: .env
    environment:
      # Пути внутри контейнера (см. telegram_bot/config.py)
      - SHARED_BASE_PATH=/shared/bloggers
      - GOOGLE_SA_JSON_PATH=/secrets/gsa.json
      # Внутри compose-сети localhost не ведёт к openclaw-gateway; переопределяем .env
      - OPENCLAW_API_URL=http://openclaw-gateway:18789
      # Cron APScheduler: локальное время контейнера (например Europe/Tallinn в .env)
      - TZ=${TZ:-UTC}
    volumes:
      - ${HOST_SHARED_PATH:-./shared}:/shared
      - ${GOOGLE_SA_JSON_HOST_PATH:-./secrets/gsa.json}:/secrets/gsa.json:ro
    depends_on:
      openclaw-gateway:
        condition: service_healthy

volumes:
  agent-board-data:
  filebrowser-data:
