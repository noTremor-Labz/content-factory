# OpenClaw: https://docs.openclaw.ai/install/docker
# CLI: docker compose --profile cli run --rm openclaw-cli <команда>

services:

  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    platform: linux/arm64
    container_name: openclaw-gateway
    restart: unless-stopped
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - n8n-data:/home/node/.n8n
      - ./shared:/home/node/shared
      - ${HOST_SHARED_PATH:-./shared}:/home/node/shared
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMMONSTACK_API_KEY=${COMMONSTACK_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      # Pixel (fal.ai / Replicate) + media upload (Cloudflare R2) env vars
      - FAL_KEY=${FAL_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - KLING_API_KEY=${KLING_API_KEY}
      - RUNWAYML_API_SECRET=${RUNWAYML_API_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_RAW=${R2_BUCKET_RAW}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    platform: linux/arm64
    container_name: openclaw-cli
    network_mode: "service:openclaw-gateway"
    volumes:
      - ${OPENCLAW_CONFIG_DIR:-~/.openclaw}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_DIR:-~/.openclaw/workspace}:/home/node/.openclaw/workspace
      - ${HOST_SHARED_PATH:-./shared}:/home/node/shared
    environment:
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - COMMONSTACK_API_KEY=${COMMONSTACK_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      # Keep same env vars in CLI container (some tools may reuse runtime)
      - FAL_KEY=${FAL_KEY}
      - REPLICATE_API_TOKEN=${REPLICATE_API_TOKEN}
      - KLING_API_KEY=${KLING_API_KEY}
      - RUNWAYML_API_SECRET=${RUNWAYML_API_SECRET}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_RAW=${R2_BUCKET_RAW}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL}
    profiles:
      - cli

  agent-board:
    image: node:22-slim
    platform: linux/arm64
    container_name: agent-board
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ${HOST_AGENT_BOARD_PATH:-./agent-board/dist}:/app
      # index.js отдаёт статику из ../dashboard → в контейнере это /dashboard (не внутри dist)
      - ${HOST_AGENT_BOARD_DASHBOARD:-./agent-board/dashboard}:/dashboard
      - agent-board-data:/app/data
    environment:
      - AGENTBOARD_API_KEYS=${AGENTBOARD_API_KEYS}
      - OPENCLAW_HOOK_URL=http://openclaw-gateway:18789/hooks/agent
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN}
      - AGENTBOARD_WEBHOOK_SECRET=${AGENTBOARD_WEBHOOK_SECRET}
    ports:
      - "3456:3456"
    command: node index.js --port 3456 --data ./data
    depends_on:
      openclaw-gateway:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    platform: linux/arm64
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./shared:/home/node/shared
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-localdev123}
      # HTTP без TLS: иначе браузер не примет secure-cookie (ошибка на скрине)
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-false}
      # Обязательно строка false: иначе $env в выражениях заблокирован (n8n-workflow: только === 'false' снимает блок)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=${N8N_BLOCK_ENV_ACCESS_IN_NODE:-false}
      # Темы в daily-queue (HTTP → OpenRouter): $env.OPENROUTER_API_KEY
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - WEBHOOK_URL=https://spotted-pokingly-nichelle.ngrok-free.dev/
      - GENERIC_TIMEZONE=Europe/Tallinn
      # Из контейнера n8n → Agent Board в той же Docker-сети
      - AGENT_BOARD_URL=${AGENT_BOARD_URL:-http://agent-board:3456}
      # Ключ из пары sk-n8n:n8n в AGENTBOARD_API_KEYS (см. .env.example)
      - N8N_AGENT_BOARD_API_KEY=${N8N_AGENT_BOARD_API_KEY:-sk-n8n}
      # Для HTTP-узлов к OpenClaw gateway из n8n (хуки — по доке OpenClaw / вашему сценарию)
      - OPENCLAW_GATEWAY_INTERNAL_URL=${OPENCLAW_GATEWAY_INTERNAL_URL:-http://openclaw-gateway:18789}
      # Bearer к /hooks/agent из workflow (HTTP Director revision и др.)
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-}
      # Bearer к POST /hooks/agent — ~/.openclaw/openclaw.json → hooks.token (см. .env.example)
      - OPENCLAW_HOOKS_TOKEN=${OPENCLAW_HOOKS_TOKEN:-}
      - OPENCLAW_HOOK_TOKEN=${OPENCLAW_HOOK_TOKEN:-}
      # Токен бота References (тот же, что в Credentials n8n для этого workflow)
      - TELEGRAM_REFERENCES_BOT_TOKEN=${TELEGRAM_REFERENCES_BOT_TOKEN:-}
      # Согласование постов: approval-бот (пусто → fallback на TELEGRAM_BOT_TOKEN в выражениях n8n)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_APPROVAL_BOT_TOKEN=${TELEGRAM_APPROVAL_BOT_TOKEN:-}
      # workflow references-style-examples: привязка chat_id → блогер (опционально)
      - TELEGRAM_STYLE_CHAT_TOMAS=${TELEGRAM_STYLE_CHAT_TOMAS:-}
      - TELEGRAM_STYLE_CHAT_MISHA=${TELEGRAM_STYLE_CHAT_MISHA:-}
      - TELEGRAM_STYLE_CHAT_YULYA=${TELEGRAM_STYLE_CHAT_YULYA:-}
      - TELEGRAM_STYLE_CHAT_NASIK=${TELEGRAM_STYLE_CHAT_NASIK:-}
      - N8N_EDITOR_BASE_URL=http://127.0.0.1:5678
      - N8N_PROTOCOL=http
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      # Разрешаем fs в Code-нодах (task runner sandbox запрещает по умолчанию)
      - NODE_FUNCTION_ALLOW_BUILTIN=fs,path
      - N8N_RUNNERS_ALLOW_BUILTIN_MODULES=fs,path


  filebrowser:
    image: filebrowser/filebrowser:latest
    platform: linux/arm64
    container_name: filebrowser
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      # Корень проекта content-factory (путь к каталогу с docker-compose.yml)
      - ${HOST_FILEBROWSER_ROOT:-.}:/srv
      - filebrowser-data:/database

volumes:
  agent-board-data:
  n8n-data:
  filebrowser-data:
